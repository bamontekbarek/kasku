<!doctype html>
<html lang="id">
  <body style="margin:0;padding:24px;background:#0b0e11;font-family:'IBM Plex Sans',Arial,sans-serif;color:#eaecef">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#1e2329;border-radius:14px">
      <tr>
        <td style="padding:28px">
          <p style="margin:0 0 16px;font-size:20px;font-weight:700;color:#fcd535">Kasku</p>
          <h1 style="margin:0 0 12px;font-size:22px">Verifikasi akun</h1>
          <p style="margin:0 0 20px;font-size:15px;line-height:22px;color:#b7bdc6">
            Halo! Klik tombol di bawah untuk memverifikasi email <strong style="color:#eaecef">{{ .Email }}</strong> dan mulai memakai Kasku.
          </p>
          <p style="margin:0 0 24px">
            <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
               style="display:inline-block;padding:14px 22px;background:#fcd535;color:#181a20;border-radius:10px;font-weight:600;text-decoration:none">
              Verifikasi email
            </a>
          </p>
          <p style="margin:0;font-size:13px;line-height:19px;color:#848e9c">
            Jika kamu tidak mendaftar di Kasku, abaikan email ini.<br />
            <span lang="en">Verify your Kasku account by tapping the button above. If you didn't sign up, ignore this email.</span>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
