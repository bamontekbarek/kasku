name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  migrations:
    name: Migrasi Supabase berjalan dari nol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      # Starts only Postgres and applies every migration in supabase/migrations (like `supabase db reset`).
      - run: supabase db start
      - name: Uji trigger user baru
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, email, raw_user_meta_data)
            values ('00000000-0000-0000-0000-000000000001', 'ci@kasku.test', '{"full_name":"CI User","locale":"en"}');
          do $$
          begin
            assert (select count(*) from public.categories where user_id = '00000000-0000-0000-0000-000000000001') = 7, 'harus 7 kategori bawaan';
            assert (select locale from public.profiles where id = '00000000-0000-0000-0000-000000000001') = 'en', 'locale profil';
            assert exists (select 1 from public.notification_settings where user_id = '00000000-0000-0000-0000-000000000001'), 'notification_settings';
            assert (select is_system from public.categories where user_id = '00000000-0000-0000-0000-000000000001' and name = 'Lainnya'), 'Lainnya = sistem';
          end $$;
          SQL
      - name: Uji transaksi, ringkasan, dan hapus kategori (M2)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-000000000001","role":"authenticated"}', true);
          set local role authenticated;
          do $$
          declare
            food uuid := (select id from public.categories where name = 'Makanan & Minuman');
            other uuid := (select id from public.categories where is_system);
            e uuid;
            s jsonb;
          begin
            e := public.save_expense(null, 50000, 'Makan siang', now(), food, 'qris', '', 'scan', '[{"name":"Nasi","price":50000}]');
            assert (select count(*) from public.expense_items where expense_id = e) = 1, 'item tersimpan';
            s := public.get_period_summary('day');
            assert (s->>'total')::bigint = 50000, 'total hari ini';
            assert jsonb_array_length(s->'series') = 7, 'deret 7 hari';
            perform public.delete_category(food);
            assert (select category_id from public.expenses where id = e) = other, 'pindah ke Lainnya';
            begin
              perform public.delete_category(other);
              raise exception 'Lainnya seharusnya tidak bisa dihapus';
            exception when sqlstate '42501' then null;
            end;
          end $$;
          rollback;
          SQL
      - name: Uji kuota scan dan receipts (M3)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local role service_role;
          do $$
          declare
            u uuid := '00000000-0000-0000-0000-000000000001';
            q jsonb;
          begin
            for i in 1..3 loop
              q := public.consume_scan_quota(u, '10.0.0.1', 20, 3, 30);
              assert (q->>'ok')::boolean, 'scan ' || i;
              perform public.finish_scan(u, false);
            end loop;
            q := public.consume_scan_quota(u, '10.0.0.1', 20, 3, 30);
            assert q->>'reason' = 'too_fast', 'batas per menit';
            perform public.finish_scan(u, true);
            assert (select count from public.scan_usage where user_id = u) = 2, 'refund';
          end $$;
          reset role;
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-000000000001","role":"authenticated"}', true);
          set local role authenticated;
          do $$
          begin
            begin
              perform public.finish_scan('00000000-0000-0000-0000-000000000001', true);
              raise exception 'user seharusnya tidak bisa mengembalikan kuota';
            exception when insufficient_privilege then null;
            end;
          end $$;
          rollback;
          SQL
      - name: Uji anggaran dan notifikasi (M4)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          select set_config('request.jwt.claims', '{"sub":"00000000-0000-0000-0000-000000000001","role":"authenticated"}', true);
          set local role authenticated;
          do $$
          declare
            cat uuid := (select id from public.categories where name = 'Transportasi');
            other uuid := (select id from public.categories where is_system);
            m date := date_trunc('month', now() at time zone 'Asia/Jayapura')::date;
            s jsonb;
          begin
            perform public.save_budget((m - interval '1 month')::date, 100000, jsonb_build_array(jsonb_build_object('category_id', cat, 'amount', 50000)));
            s := public.get_budget_status();
            assert (s->>'total')::bigint = 100000, 'anggaran bulan lalu disalin (BUD-05)';
            perform public.save_expense(null, 45000, 'Ojek', now(), cat, 'cash', '', 'manual', null);
            assert (select count(*) from public.notifications where type = 'budget_near') = 1, 'hampir habis';
            perform public.save_expense(null, 10000, 'Ojek', now(), cat, 'cash', '', 'manual', null);
            assert (select count(*) from public.notifications where type = 'budget_over') = 1, 'lewat batas';
            perform public.save_expense(null, 1000, 'Ojek', now(), cat, 'cash', '', 'manual', null);
            assert (select count(*) from public.notifications where type = 'budget_over') = 1, 'tidak dobel';
            perform public.mark_notifications_read();
            assert (select count(*) from public.notifications where read_at is null) = 0, 'tandai dibaca';
            perform public.delete_category(cat);
            assert (select amount from public.budgets where category_id = other and month = m) = 50000, 'batas pindah ke Lainnya';
            begin
              perform public.run_scheduled_notifications();
              raise exception 'user seharusnya tidak bisa menjalankan jadwal';
            exception when insufficient_privilege then null;
            end;
          end $$;
          reset role;
          do $$
          begin
            update public.notification_settings set reminder_time = '00:00';
            perform public.run_scheduled_notifications();
            assert exists (select 1 from cron.job where jobname = 'kasku-scheduled-notifications'), 'cron terjadwal';
          end $$;
          rollback;
          SQL
